name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    concurrency:
      group: audit-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Own job, not a step inside validate: an audit failure must not stop
      # type-check and build from reporting their own status.
      - name: Security audit
        run: pnpm audit --audit-level=high

  validate:
    name: Run Pre-Deployment Checks
    runs-on: ubuntu-latest
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm run check
        continue-on-error: false

      - name: Build application
        run: pnpm run build
        continue-on-error: false

      - name: Check for React Hook violations
        run: |
          echo "🔍 Checking for React Hook violations..."

          # Check for hooks called after conditional returns
          if grep -r "if.*return" client/src --include="*.tsx" --include="*.ts" -A 20 | grep -E "use[A-Z]|useMemo|useEffect|useState|useCallback"; then
            echo "⚠️  WARNING: Potential hooks called after conditional returns"
          fi

          # Check for hooks in loops
          if grep -r "for\|while\|map.*=>.*{" client/src --include="*.tsx" --include="*.ts" -A 5 | grep -E "use[A-Z]"; then
            echo "⚠️  WARNING: Potential hooks in loops"
          fi

      - name: Validate build output
        run: |
          if [ ! -d "dist/public" ]; then
            echo "❌ Build output directory not found!"
            exit 1
          fi

          # Check build size
          BUILD_SIZE=$(du -sh dist/public | cut -f1)
          echo "✅ Build size: $BUILD_SIZE"

          # Check for critical files
          for file in "index.html" "assets"; do
            if [ ! -e "dist/public/$file" ]; then
              echo "❌ Missing critical file: $file"
              exit 1
            fi
          done

          echo "✅ All critical build files present"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  tests:
    name: Tests
    runs-on: ubuntu-latest
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm run test:e2e

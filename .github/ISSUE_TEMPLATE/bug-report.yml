name: Bug report
description: Something in the app is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps another person could follow to see the same thing.
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: >
        Two or three testable statements that must all be true for this to count as fixed.
        Draw them from what you actually observed, not from how you imagine the fix working.
      placeholder: |
        - [ ] Reloading the app after ticking a chore no longer resets the child's total to zero
        - [ ] The IndexedDB migration completes without a console error on first load
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and whether this was on the deployed site or a local dev build.
      placeholder: e.g. Chrome 128 on Android, https://candr.lunt.au
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, console errors, links to related issues.
    validations:
      required: false
